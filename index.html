<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>수능 응원 보드</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --cork: #c89f6f;
            --ink: #2b2118;
            --accent: #d9482b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Noto Sans KR", system-ui, sans-serif;
            color: var(--ink);
            background-color: var(--cork);
            background-image: radial-gradient(rgba(0,0,0,.08) 1px, transparent 1.5px), radial-gradient(rgba(255,255,255,.10) 1px, transparent 1.5px);
            background-size: 14px 14px, 22px 22px;
            background-position: 0 0, 7px 11px;
        }

        header {
            text-align: center;
            padding: 32px 16px 8px;
        }

        h1 {
            font-family: "Gaegu", cursive;
            font-size: clamp(2.2rem, 6vw, 3.4rem);
            margin: 0;
            color: #fff;
            text-shadow: 2px 3px 0 rgba(0,0,0,.25);
        }

        .sub {
            margin: 6px 0 0;
            color: #fff8ee;
            font-size: .95rem;
        }

        form {
            max-width: 560px;
            margin: 20px auto 8px;
            padding: 0 16px;
            display: flex;
            gap: 8px;
        }

        .field {
            flex: 1;
            position: relative;
        }

        input[type=text] {
            width: 100%;
            padding: 14px 64px 14px 16px;
            font-size: 1rem;
            font-family: inherit;
            border: 3px solid var(--ink);
            border-radius: 12px;
            background: #fffdf6;
            outline: none;
        }

            input[type=text]:focus {
                box-shadow: 0 0 0 4px rgba(255,255,255,.6);
            }

        .count {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: .8rem;
            color: #8a7a68;
            font-variant-numeric: tabular-nums;
        }

            .count.over {
                color: var(--accent);
                font-weight: 700;
            }

        button {
            font-family: inherit;
            font-weight: 700;
            font-size: 1rem;
            border: 3px solid var(--ink);
            border-radius: 12px;
            padding: 0 20px;
            cursor: pointer;
            background: #ffe066;
            color: var(--ink);
            box-shadow: 0 4px 0 var(--ink);
            transition: transform .08s, box-shadow .08s;
        }

            button:active {
                transform: translateY(3px);
                box-shadow: 0 1px 0 var(--ink);
            }

            button:disabled {
                opacity: .55;
                cursor: not-allowed;
            }

        .status-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            min-height: 40px;
            padding: 0 16px;
            flex-wrap: wrap;
        }

        .msg {
            font-size: .9rem;
            color: #fff;
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(0,0,0,.3);
        }

            .msg.error {
                color: #fff;
                background: var(--accent);
                padding: 4px 10px;
                border-radius: 8px;
                text-shadow: none;
            }

        .live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: .8rem;
            color: #fff;
            background: rgba(0,0,0,.25);
            padding: 4px 10px;
            border-radius: 999px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #aaa;
        }

        .live.on .dot {
            background: #4ade80;
            animation: pulse 1.6s infinite;
        }

        .live.off .dot {
            background: #f87171;
        }

        @keyframes pulse {
            50% {
                opacity: .35;
            }
        }

        #refreshBtn {
            padding: 6px 14px;
            font-size: .85rem;
            background: #fff;
            display: none;
        }

            #refreshBtn.show {
                display: inline-block;
            }

        #board {
            max-width: 1100px;
            margin: 8px auto 48px;
            padding: 0 16px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 22px;
        }

        .note {
            position: relative;
            min-height: 150px;
            padding: 26px 16px 14px;
            font-family: "Gaegu", cursive;
            font-size: 1.35rem;
            line-height: 1.35;
            word-break: break-word;
            box-shadow: 0 10px 14px -8px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.15);
            transform: rotate(var(--r));
            transition: transform .15s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

            .note:hover {
                transform: rotate(0deg) scale(1.04);
                z-index: 2;
            }

            .note::before { /* 테이프 */
                content: "";
                position: absolute;
                top: -10px;
                left: 50%;
                width: 70px;
                height: 22px;
                transform: translateX(-50%) rotate(-3deg);
                background: rgba(255,255,255,.55);
                box-shadow: 0 1px 2px rgba(0,0,0,.15);
            }

            .note time {
                font-family: "Noto Sans KR", sans-serif;
                font-size: .7rem;
                color: rgba(0,0,0,.45);
                margin-top: 10px;
                text-align: right;
            }

            .note.new {
                animation: drop .45s cubic-bezier(.2,.9,.3,1.3);
            }

        @keyframes drop {
            from {
                opacity: 0;
                transform: translateY(-30px) rotate(var(--r)) scale(.85);
            }

            to {
                opacity: 1;
                transform: rotate(var(--r));
            }
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            color: #fff;
            font-size: 1.1rem;
            padding: 40px 0;
        }

        footer {
            text-align: center;
            font-size: .75rem;
            color: rgba(255,255,255,.75);
            padding-bottom: 24px;
        }

        .sound-ctl {
            position: fixed;
            right: 16px;
            bottom: 16px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

            .sound-ctl button {
                padding: 8px 14px;
                font-size: .85rem;
                background: #fff;
                box-shadow: 0 3px 0 var(--ink);
            }

                .sound-ctl button[aria-pressed="true"] {
                    background: #ffe066;
                }

        @media (max-width: 480px) {
            #board {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }

            .note {
                min-height: 120px;
                font-size: 1.15rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>수험생 여러분, 응원합니다!</h1>
        <p class="sub">로그인 없이 한 줄 응원을 남겨주세요 · 최대 50자</p>
    </header>

    <form id="form" autocomplete="off">
        <div class="field">
            <input id="input" type="text" placeholder="예) 그동안 고생 많았어, 실력 다 보여주고 와!" aria-label="응원 메시지" />
            <span id="count" class="count">0/50</span>
        </div>
        <button id="submitBtn" type="submit">붙이기</button>
    </form>

    <div class="status-row">
        <span id="live" class="live"><span class="dot"></span><span id="liveText">연결 중…</span></span>
        <button id="refreshBtn" type="button">↻ 최신 응원 불러오기</button>
        <span id="msg" class="msg" role="status"></span>
    </div>

    <main id="board" aria-live="polite"></main>
    <footer>최신 응원 50개만 표시됩니다</footer>

    <div class="sound-ctl">
        <button id="musicBtn" type="button" aria-pressed="false">🎵 배경음악 켜기</button>
        <button id="sfxBtn" type="button" aria-pressed="true">🔊 효과음</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        /* ==== 설정: Supabase 대시보드 > Project Settings > API 에서 복사 ==== */
        const SUPABASE_URL = "https://xkvkbgaphzqsdbakuthz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_dBqQIzVc2RxoHQZ6kKC6WQ_orHIwB-1";
        // anon(공개) 키만! service_role 키는 절대 넣지 마세요
        /* ================================================================= */

        const MAX_LEN = 50;
        const MAX_SHOW = 50;
        const COOLDOWN_MS = 5000;
        const COLORS = ["#fff59d", "#ffcc80", "#f8bbd0", "#b3e5fc", "#c5e1a5", "#d1c4e9", "#ffe0b2"];

        /* ---- 욕설 필터 (DB의 has_profanity 함수와 같은 규칙) ---- */
        const BAD_WORDS = /(씨발|시발|씨빨|시빨|쓰발|ㅅㅂ|ㅆㅂ|병신|븅신|ㅂㅅ|개새끼|개새기|개색기|개색히|새끼|좆|존나|졸라|ㅈㄴ|지랄|ㅈㄹ|염병|엠창|느금|니애미|애미|애비|fuck|shit|bitch|asshole)/;
        function hasProfanity(text) {
            const normalized = String(text).toLowerCase()
                .replaceAll("시발점", "").replaceAll("새끼손가락", "")
                .replace(/[^가-힣ㄱ-ㅎa-z]/g, "");   // 공백·숫자·특수문자 끼워넣기 무력화
            return BAD_WORDS.test(normalized);
        }
        const charLen = (s) => Array.from(s).length;   // DB의 char_length 와 같은 기준(코드포인트)

        /* ---- DOM ---- */
        const $ = (id) => document.getElementById(id);
        const form = $("form"), input = $("input"), countEl = $("count"), submitBtn = $("submitBtn");
        const board = $("board"), msgEl = $("msg"), live = $("live"), liveText = $("liveText"), refreshBtn = $("refreshBtn");

        let cheers = [];          // 최신순
        let realtimeOk = false;
        let lastSent = 0;

        function showMsg(text, isError = false) {
            msgEl.textContent = text;
            msgEl.className = "msg" + (isError ? " error" : "");
            if (text) setTimeout(() => { if (msgEl.textContent === text) showMsg(""); }, 3500);
        }

        function noteStyle(id) {
            let h = 0;
            for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
            return { color: COLORS[h % COLORS.length], rot: ((h % 9) - 4) * 0.9 };
        }

        function timeLabel(iso) {
            const d = new Date(iso);
            const diff = (Date.now() - d) / 1000;
            if (diff < 60) return "방금 전";
            if (diff < 3600) return Math.floor(diff / 60) + "분 전";
            if (diff < 86400) return Math.floor(diff / 3600) + "시간 전";
            return d.toLocaleDateString("ko-KR", { month: "short", day: "numeric" });
        }

        function makeNote(c, isNew) {
            const el = document.createElement("article");
            const { color, rot } = noteStyle(c.id);
            el.className = "note" + (isNew ? " new" : "");
            el.style.background = color;
            el.style.setProperty("--r", rot + "deg");
            const p = document.createElement("div");
            p.textContent = c.content;                    // textContent → HTML 주입(XSS) 방지
            const t = document.createElement("time");
            t.dateTime = c.created_at;
            t.textContent = timeLabel(c.created_at);
            el.append(p, t);
            return el;
        }

        function render(newId) {
            board.replaceChildren();
            if (!cheers.length) {
                const e = document.createElement("p");
                e.className = "empty";
                e.textContent = "첫 응원을 남겨주세요 ✏️";
                board.append(e);
                return;
            }
            for (const c of cheers) board.append(makeNote(c, c.id === newId));
        }

        function addCheer(c) {
            if (!c || cheers.some((x) => x.id === c.id)) return;   // 중복 방지
            cheers.unshift(c);
            cheers.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            cheers = cheers.slice(0, MAX_SHOW);                    // 최신 50개 유지
            render(c.id);
            Sound.paper();                                         // 포스트잇 붙는 소리
        }

        /* ================================================================
           사운드 : 외부 파일 없이 Web Audio API로 직접 합성
           - 배경음악: 피아노 분산화음 + 현악 선율, 홀 잔향 (파헬벨 「캐논」 코드 진행, 1680년경 작품으로 저작권 만료)
           - 효과음: 포스트잇을 손가락으로 "쓱" 눌러 펴는 소리 (낮은 음역 제거)
           ================================================================ */
        const SFX_VOLUME = 0.5;   // 효과음 크기 (1 = 원래 크기, 0.5 = 절반). 더 줄이려면 이 숫자만 낮추면 됨
        const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);

        function makeNoise(ac) {
            const buf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            return buf;
        }

        function envGain(ac, t, peak, attack, release) {
            const g = ac.createGain();
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(peak, t + attack);
            g.gain.exponentialRampToValueAtTime(0.0001, t + attack + release);
            return g;
        }

        /* 홀 잔향용 임펄스 (노이즈가 2.4초에 걸쳐 사라지는 모양) */
        function makeHallImpulse(ac, sec = 2.4) {
            const len = Math.floor(ac.sampleRate * sec);
            const buf = ac.createBuffer(2, len, ac.sampleRate);
            for (let c = 0; c < 2; c++) {
                const d = buf.getChannelData(c);
                for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
            }
            return buf;
        }

        /* 포스트잇 눌러 붙이는 소리 : t초에 시작, 약 0.3초
           손가락으로 "쓱" 쓸어 펴는 마찰음 하나만. 낮은 음(700Hz↓)과 귀를 찌르는 높은 음(9kHz↑)은 잘라 부드럽게 */
        function synthPaper(ac, out, t, noise) {
            const dur = 0.26 + Math.random() * 0.05;      // 매번 길이·결이 조금씩 달라 자연스럽게

            const hp = ac.createBiquadFilter();
            hp.type = "highpass"; hp.frequency.value = 700; hp.Q.value = 0.6;
            const lp = ac.createBiquadFilter();
            lp.type = "lowpass"; lp.frequency.value = 9000; lp.Q.value = 0.5;
            hp.connect(lp).connect(out);

            // 쓸어내리는 손의 힘 곡선: 빠르게 커졌다가(약 35% 지점) 천천히 잦아듦
            const N = 64, curve = (peak) => {
                const c = new Float32Array(N);
                for (let i = 0; i < N; i++) {
                    const x = i / (N - 1);
                    c[i] = Math.max(0.0001, peak * Math.pow(Math.sin(Math.PI * Math.pow(x, 0.7)), 1.6));
                }
                return c;
            };

            // ① 몸통: 종이 면을 문지르는 "스—" (손이 움직이며 음색이 조금 밝아짐)
            const body = ac.createBufferSource();
            body.buffer = noise;
            const bf = ac.createBiquadFilter();
            bf.type = "bandpass"; bf.Q.value = 0.7;
            bf.frequency.setValueAtTime(1700, t);
            bf.frequency.linearRampToValueAtTime(2900, t + dur);
            const bg = ac.createGain();
            bg.gain.setValueAtTime(0.0001, t);
            bg.gain.setValueCurveAtTime(curve(0.26), t, dur);
            body.connect(bf).connect(bg).connect(hp);
            body.start(t, Math.random() * 0.6, dur + 0.02);

            // ② 결: 손끝과 종이 섬유가 스치는 잘게 부서지는 고음. 불규칙하게 흔들어 "사각" 질감을 줌
            const grain = ac.createBufferSource();
            grain.buffer = noise;
            const gf = ac.createBiquadFilter();
            gf.type = "highpass"; gf.frequency.value = 4500;
            const gEnv = ac.createGain();
            gEnv.gain.setValueAtTime(0.0001, t);
            gEnv.gain.setValueCurveAtTime(curve(0.11), t, dur);
            const jitter = ac.createGain();                  // 불규칙 떨림
            jitter.gain.value = 0.6;
            const mod = ac.createBufferSource();
            mod.buffer = noise;
            const mf = ac.createBiquadFilter();
            mf.type = "lowpass"; mf.frequency.value = 45;
            const mAmt = ac.createGain(); mAmt.gain.value = 3;
            mod.connect(mf).connect(mAmt).connect(jitter.gain);
            grain.connect(gf).connect(gEnv).connect(jitter).connect(hp);
            grain.start(t, Math.random() * 0.6, dur + 0.02);
            mod.start(t, Math.random() * 0.6, dur + 0.02);
        }

        /* ---- 배경음악 ---- */
        const BPM = 66;
        const STEP = 60 / BPM / 4;                   // 16분음표
        const STEPS_PER_CHORD = 8;                   // 화음 하나 = 2박
        // 파헬벨 「캐논」 진행을 C장조로: C - G/B - Am - Em/G - F - C/E - F - G
        // [베이스, 분산화음 4음, 현악 선율음]
        const CANON = [
            [48, [60, 64, 67, 72], 76],
            [47, [59, 62, 67, 71], 74],
            [45, [57, 60, 64, 69], 72],
            [43, [55, 59, 64, 67], 71],
            [41, [57, 60, 65, 69], 69],
            [40, [55, 60, 64, 67], 67],
            [41, [57, 60, 65, 69], 69],
            [43, [59, 62, 67, 71], 71],
        ];
        const ARP = [0, 1, 2, 3, 1, 2, 3, 2];          // 바흐 프렐류드풍 분산화음 순서

        /* 피아노 한 음: 배음마다 감쇠 속도를 달리해 "띵—" 하고 자연스럽게 사라지게 */
        function piano(ac, out, t, m, vel) {
            const f = midiHz(m);
            const len = Math.max(1.2, 3.2 - (m - 40) * 0.04);   // 낮은 음일수록 길게 울림
            const g = ac.createGain();
            g.gain.value = vel;
            g.connect(out);
            [[1, 1], [2, 0.42], [3, 0.2], [4, 0.1], [5, 0.05]].forEach(([n, a], i) => {
                const o = ac.createOscillator();
                o.type = "sine";
                o.frequency.value = f * n * (1 + 0.0004 * n * n);   // 피아노 특유의 약간 높아지는 배음
                o.connect(envGain(ac, t, a, 0.004, len / (1 + i * 0.8))).connect(g);
                o.start(t); o.stop(t + len + 0.05);
            });
        }

        /* 현악기 한 음: 톱니파 두 개 + 비브라토, 천천히 커졌다 사라짐 */
        function strings(ac, out, t, m, dur, vol) {
            const lp = ac.createBiquadFilter();
            lp.type = "lowpass"; lp.frequency.value = 1700; lp.Q.value = 0.5;
            const g = ac.createGain();
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(vol, t + 0.45);
            g.gain.setValueAtTime(vol, t + dur - 0.1);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.6);
            lp.connect(g).connect(out);
            const vib = ac.createOscillator();
            vib.frequency.value = 5.2;
            const vibAmt = ac.createGain(); vibAmt.gain.value = 7;      // ±7센트
            vib.connect(vibAmt);
            for (const det of [-5, 5]) {
                const o = ac.createOscillator();
                o.type = "sawtooth";
                o.frequency.value = midiHz(m);
                o.detune.value = det;
                vibAmt.connect(o.detune);
                o.connect(lp);
                o.start(t); o.stop(t + dur + 0.7);
            }
            vib.start(t); vib.stop(t + dur + 0.7);
        }

        function synthMusicStep(ac, out, t, step) {
            const inChord = step % STEPS_PER_CHORD;
            const chordIdx = Math.floor(step / STEPS_PER_CHORD);
            const [bass, arp, mel] = CANON[chordIdx % CANON.length];
            const round = Math.floor(chordIdx / CANON.length) % 3;   // 1회차: 피아노만 → 2회차: 현악 선율 → 3회차: 한 옥타브 위 선율 + 첼로
            const chordLen = STEP * STEPS_PER_CHORD;

            // 피아노: 첫 박은 조금 세게, 나머지는 여리게
            if (inChord === 0) piano(ac, out, t, bass, 0.075);
            piano(ac, out, t, arp[ARP[inChord]], inChord === 0 ? 0.05 : 0.034);

            if (inChord === 0 && round >= 1) {
                strings(ac, out, t, round === 2 ? mel + 12 : mel, chordLen, 0.016);
                if (round === 2) strings(ac, out, t, bass, chordLen, 0.014);
            }
        }

        const Sound = (() => {
            let ac = null, musicBus, sfxBus, noise, timer = null, nextTime = 0, step = 0;
            let musicOn = false, sfxOn = true;
            try { sfxOn = localStorage.getItem("cheer-sfx") !== "off"; } catch (e) { }

            function init() {      // 브라우저 정책상 사용자가 클릭/입력한 뒤에만 소리를 낼 수 있음
                if (!ac) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) return null;
                    ac = new AC();
                    noise = makeNoise(ac);
                    const master = ac.createGain();
                    master.gain.value = 0.8;
                    master.connect(ac.destination);
                    sfxBus = ac.createGain();
                    sfxBus.gain.value = SFX_VOLUME;
                    sfxBus.connect(master);
                    musicBus = ac.createGain();
                    musicBus.gain.value = 0;
                    // 콘서트홀 같은 잔향
                    const dry = ac.createGain();
                    const hall = ac.createConvolver();
                    hall.buffer = makeHallImpulse(ac);
                    const wet = ac.createGain(); wet.gain.value = 0.32;
                    dry.connect(musicBus);
                    dry.connect(hall).connect(wet).connect(musicBus);
                    musicBus.connect(master);
                    musicBus.input = dry;
                }
                if (ac.state === "suspended") ac.resume();
                return ac;
            }

            function scheduler() {
                while (nextTime < ac.currentTime + 0.25) {
                    synthMusicStep(ac, musicBus.input, nextTime, step++);
                    nextTime += STEP;
                }
            }

            function setMusic(on) {
                if (!init()) return;
                musicOn = on;
                const now = ac.currentTime;
                musicBus.gain.cancelScheduledValues(now);
                musicBus.gain.setTargetAtTime(on ? 1 : 0, now, on ? 0.6 : 0.3);
                if (on && !timer) {
                    nextTime = now + 0.1; step = 0;
                    timer = setInterval(scheduler, 50);
                } else if (!on && timer) {
                    const t = timer; timer = null;
                    setTimeout(() => { if (!musicOn) clearInterval(t); else timer = t; }, 1500);
                }
            }

            return {
                unlock: () => init(),
                get musicOn() { return musicOn; },
                get sfxOn() { return sfxOn; },
                toggleMusic() { setMusic(!musicOn); return musicOn; },
                toggleSfx() {
                    sfxOn = !sfxOn;
                    try { localStorage.setItem("cheer-sfx", sfxOn ? "on" : "off"); } catch (e) { }
                    return sfxOn;
                },
                paper() {
                    // 아직 한 번도 클릭하지 않은 방문자에게는 조용히 건너뜀(자동재생 차단 정책)
                    if (!sfxOn || !ac || ac.state !== "running") return;
                    synthPaper(ac, sfxBus, ac.currentTime + 0.16, noise);   // 떨어지는 애니메이션(0.45초)이 판에 처음 닿는 0.16초에 맞춤
                },
            };
        })();

        const musicBtn = $("musicBtn"), sfxBtn = $("sfxBtn");
        function syncSoundButtons() {
            musicBtn.setAttribute("aria-pressed", String(Sound.musicOn));
            musicBtn.textContent = Sound.musicOn ? "🎵 배경음악 끄기" : "🎵 배경음악 켜기";
            sfxBtn.setAttribute("aria-pressed", String(Sound.sfxOn));
            sfxBtn.textContent = Sound.sfxOn ? "🔊 효과음" : "🔇 효과음";
        }
        musicBtn.addEventListener("click", () => { Sound.toggleMusic(); syncSoundButtons(); });
        sfxBtn.addEventListener("click", () => { Sound.toggleSfx(); syncSoundButtons(); });
        // 페이지 어디든 처음 누르거나 입력하면 오디오 잠금 해제 → 이후 다른 사람 응원에도 효과음
        ["pointerdown", "keydown"].forEach((ev) => document.addEventListener(ev, () => Sound.unlock(), { once: true }));
        syncSoundButtons();

        /* ---- Supabase ---- */
        const configured = !SUPABASE_URL.includes("YOUR-PROJECT") && !SUPABASE_KEY.startsWith("YOUR-");
        const db = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        async function loadLatest() {
            if (!db) return;
            refreshBtn.disabled = true;
            const { data, error } = await db
                .from("cheers")
                .select("id, content, created_at")
                .order("created_at", { ascending: false })
                .limit(MAX_SHOW);
            refreshBtn.disabled = false;
            if (error) { showMsg("응원을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.", true); console.error(error); return; }
            cheers = data;
            render();
        }

        function setLive(state) {
            realtimeOk = state === "on";
            live.className = "live " + (state === "on" ? "on" : state === "off" ? "off" : "");
            liveText.textContent = state === "on" ? "실시간 연결됨" : state === "off" ? "실시간 연결 끊김" : "연결 중…";
            refreshBtn.classList.toggle("show", state === "off");
        }

        function subscribe() {
            db.channel("cheers-feed")
                .on("postgres_changes", { event: "INSERT", schema: "public", table: "cheers" },
                    (payload) => addCheer(payload.new))
                .subscribe((status, err) => {
                    if (status === "SUBSCRIBED") {
                        const wasOff = live.classList.contains("off");
                        setLive("on");
                        if (wasOff) loadLatest();          // 끊긴 사이 놓친 응원 보충
                    } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
                        setLive("off");
                        if (err) console.warn("Realtime:", status, err);
                    }
                });
        }

        /* ---- 입력 ---- */
        input.addEventListener("input", () => {
            const n = charLen(input.value);
            countEl.textContent = `${n}/${MAX_LEN}`;
            countEl.classList.toggle("over", n > MAX_LEN);
        });

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!db) return showMsg("Supabase 설정(URL·키)을 먼저 입력해 주세요.", true);
            if (!text) return showMsg("응원 내용을 적어주세요.", true);
            if (charLen(text) > MAX_LEN) return showMsg(`${MAX_LEN}자 이하로 적어주세요.`, true);
            if (hasProfanity(text)) return showMsg("고운 말로 응원해 주세요 🙏", true);
            const wait = COOLDOWN_MS - (Date.now() - lastSent);
            if (wait > 0) return showMsg(`${Math.ceil(wait / 1000)}초 후에 다시 남길 수 있어요.`, true);

            submitBtn.disabled = true;
            const { error } = await db.from("cheers").insert({ content: text });
            submitBtn.disabled = false;

            if (error) {
                console.error(error);
                if (error.code === "23514") return showMsg("허용되지 않는 내용이에요. 다시 적어주세요.", true); // CHECK 위반
                return showMsg("등록에 실패했어요. 잠시 후 다시 시도해 주세요.", true);
            }
            lastSent = Date.now();
            input.value = "";
            input.dispatchEvent(new Event("input"));
            showMsg("응원이 붙었어요! 💛");
            if (!realtimeOk) { Sound.paper(); loadLatest(); }   // 실시간이 끊겨 있으면 직접 갱신(소리도 여기서)
        });

        refreshBtn.addEventListener("click", loadLatest);

        /* 상대 시간("3분 전") 1분마다 갱신 */
        setInterval(() => document.querySelectorAll(".note time").forEach((t) => { t.textContent = timeLabel(t.dateTime); }), 60000);

        /* ---- 시작 ---- */
        if (!db) {
            setLive("off");
            refreshBtn.classList.remove("show");
            liveText.textContent = "설정 필요";
            render();
            showMsg("index.html 안의 SUPABASE_URL과 SUPABASE_KEY를 채워주세요.", true);
        } else {
            loadLatest();
            subscribe();
        }
    </script>
</body>
</html>
